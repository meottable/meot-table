<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | 멋:테이블</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--green:#173326;--green2:#28523e;--paper:#f5efe5;--ink:#181713;--muted:#6e6a62;--gold:#c89438}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--paper);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all}
main{width:min(460px,100%);background:#fffdfa;border-radius:16px;padding:36px 26px;text-align:center;box-shadow:0 18px 50px rgba(23,51,38,.12)}
.logo{font-weight:900;font-size:22px;letter-spacing:-.03em;color:var(--green);text-decoration:none}
.logo span{color:var(--gold)}
h1{margin:18px 0 8px;font-size:22px;line-height:1.4}
p{margin:0 0 24px;color:var(--muted);line-height:1.7;font-size:15px}
.btns{display:grid;gap:10px}
a.btn{display:block;padding:15px 16px;border-radius:10px;font-weight:800;font-size:16px;text-decoration:none}
.primary{background:var(--green);color:#fff}
.ghost{border:1px solid #d9cbbb;color:var(--green2)}
small{display:block;margin-top:20px;color:var(--muted);font-size:13px}
small a{color:inherit}
</style>
</head>
<body>
<main>
  <a class="logo" href="/">멋<span>:</span>테이블</a>
  <h1>찾으시는 페이지가 없어요</h1>
  <p>주소가 바뀌었거나 없어진 페이지입니다.<br>아래에서 원하시는 곳으로 이동해 주세요.</p>
  <div class="btns">
    <a class="btn primary" href="/">홈으로 가기</a>
    <a class="btn ghost" href="/cases/">납품 사례 보기</a>
    <a class="btn ghost" href="/#estimate">예상견적 확인하기</a>
  </div>
  <small>상담 <a href="tel:010-6292-8562">010-6292-8562</a> · <a href="https://pf.kakao.com/_BZeSX/chat">카카오톡 '멋테이블'</a></small>
</main>
</body>
</html>
